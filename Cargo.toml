[package]
name = "paillier-zk"
version = "0.4.2"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "ZK-proofs for Paillier encryption scheme"
repository = "https://github.com/LFDT-Lockness/paillier-zk"
categories = ["algorithms", "cryptography"]
keywords = ["paillier", "zk-proofs", "zero-knowledge"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
generic-ec = {git="https://github.com/nxhieu3102/generic-ec", branch="feat/integrate-cggmp21" , features = ["udigest"] }
fast-paillier = { git = "https://github.com/nxhieu3102/fast-paillier" }
rand_core = { version = "0.6", default-features = false }
digest = "0.10"

rand_hash = "0.1"
thiserror = "1"
serde = { version = "1", features = ["derive"], optional = true }
serde_with = { version = "3", default-features = false, features = [
    "macros",
], optional = true }
udigest = { version = "0.2.1", default-features = false, features = [
    "inline-struct",
    "derive",
    "alloc",
] }
num-bigint = { version = "0.4.6", features = ["rand"] }
num-integer = "0.1.46"
num-traits = "0.2.19"
rand = "0.8"
bincode = "2.0.1"

[dev-dependencies]
generic-ec = { git="https://github.com/nxhieu3102/generic-ec", branch="feat/integrate-cggmp21", features = ["udigest", "all-curves"] }
rand_dev = { version = "0.1", default-features = false }
sha2 = { version = "0.10", default-features = false }

subtle = { version = "2.4", default-features = false }
zeroize = { version = "1.5", default-features = false }

anyhow = "1"
serde_json = "1"

[features]
default = []
serde = [
    "dep:serde",
    "dep:serde_with",
    "generic-ec/serde",
    "fast-paillier/serde",
]

# This features is exlusively used for `cargo test --doc`
__internal_doctest = ["serde"]

[[example]]
name = "pregenerate"
required-features = ["serde"]

[package.metadata.docs.rs]
all-features = true
